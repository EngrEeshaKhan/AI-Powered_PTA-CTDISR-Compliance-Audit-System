services:

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: pta-ctdisr-backend

    restart: unless-stopped

    ports:
      - "8000:8000"

    volumes:
      - ./backend:/app
      - ./storage:/app/storage
      - ./models:/app/models

    env_file:
      - ./backend/.env

    command: >
      uvicorn app.main:app
      --host 0.0.0.0
      --port 8000


  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    container_name: pta-ctdisr-frontend

    restart: unless-stopped

    ports:
      - "5173:5173"

    volumes:
      - ./frontend:/app
      - /app/node_modules

    depends_on:
      - backend

    command: npm run dev -- --host 0.0.0.0